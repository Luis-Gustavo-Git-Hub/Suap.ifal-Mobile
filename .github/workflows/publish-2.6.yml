name: Publish verified APK 2.6

on:
  push:
    tags:
      - v2.6

permissions:
  contents: write

concurrency:
  group: publish-v2.6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve and verify the APK built from c25c79b
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suap-2.6"
          cd "$RUNNER_TEMP/suap-2.6"
          gh api "repos/$GH_REPO/git/blobs/80e7c17b6860bf35c2e60176174422fd1cc56fcb" \
            -H 'Accept: application/vnd.github.raw' > SUAP-2.6-debug.apk
          echo '4b8cf0990c61827bd6b938f53a42bc90e73a7439bd279b4e67f195493284d060  SUAP-2.6-debug.apk' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload verified files and publish the prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/suap-2.6"
          gh release upload v2.6 SUAP-2.6-debug.apk SHA256SUMS.txt --clobber
          gh release edit v2.6 --draft=false --latest
